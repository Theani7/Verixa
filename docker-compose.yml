services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: verixa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verixa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verixa}
      POSTGRES_DB: ${POSTGRES_DB:-verixa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verixa} -d ${POSTGRES_DB:-verixa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: verixa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-verixa}:${POSTGRES_PASSWORD:-verixa}@postgres:5432/${POSTGRES_DB:-verixa}
      - EXA_API_KEY=${EXA_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - MODEL_NAME=${MODEL_NAME}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: verixa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
